# XcodeGen project definition. The .xcodeproj is generated in CI (`xcodegen generate`) and never committed.
name: YESBooks
options:
  bundleIdPrefix: com.yachtengineeringservices
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  YESBooks:
    type: application
    platform: iOS
    sources:
      - YESBooks
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yachtengineeringservices.yesbooks
        PRODUCT_NAME: YESBooks
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: YESBooks/Info.plist
      properties:
        CFBundleDisplayName: YES Books
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Take photos of receipts to attach them to expenses.
        NSPhotoLibraryUsageDescription: Pick receipt photos to attach them to expenses.
        ITSAppUsesNonExemptEncryption: false
