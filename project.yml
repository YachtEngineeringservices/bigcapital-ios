# XcodeGen project definition. The .xcodeproj is generated in CI (`xcodegen generate`) and never committed.
# The bundle id includes the Apple team id, so every fork signs as its own app (fastlane passes DEVELOPMENT_TEAM).
name: BigcapitalIOS
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  BigcapitalIOS:
    type: application
    platform: iOS
    sources:
      - App
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.$(DEVELOPMENT_TEAM).bigcapital-ios
        PRODUCT_NAME: BigcapitalIOS
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bigcapital U
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Take photos of receipts to attach them to expenses.
        NSPhotoLibraryUsageDescription: Pick receipt photos to attach them to expenses.
        ITSAppUsesNonExemptEncryption: false
