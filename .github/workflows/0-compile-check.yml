name: 0. Compile check
# Builds for the iOS simulator without signing, on every push: catches Swift errors without any Apple secrets.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project YESBooks.xcodeproj -scheme YESBooks -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
